<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseTrack — Location Request</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/pwa-register.js" defer></script>
</head>

<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon"><img src="/icon-192.png" alt="ExpenseTrack" /></div>
        <span class="logo-text">ExpenseTrack</span>
      </div>
      <div class="sidebar-nav">
        <p class="sidebar-nav-label">Menu</p>
        <a href="dashboard.html" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          Dashboard
        </a>
        <a href="add-expense.html" class="sidebar-link" id="sb-add-link" style="display:none">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
          Add Expense
        </a>
        <a href="attendance-checkin.html" class="sidebar-link" id="sb-checkin-link" style="display:none">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          Site Check-in
        </a>
        <a href="location-request.html" class="sidebar-link active" id="sb-location-request-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
          Location Request
          <span id="lr-badge" style="display:none;margin-left:auto;background:#dc2626;color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:.68rem;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px"></span>
        </a>
        <a href="profile.html" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          My Profile
        </a>
        <a href="#" onclick="logout();return false" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          Sign Out
        </a>
      </div>
    </nav>

    <div class="app-main">
      <header class="topbar">
        <button class="topbar-menu" onclick="toggleSidebar()" aria-label="Open menu">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <span class="topbar-title">Location request</span>
        <div class="topbar-right"></div>
      </header>

      <main class="page-content" style="max-width:520px;margin:0 auto">
        <div style="margin-bottom:1rem">
          <h1 style="margin:0 0 .25rem;font-size:1.35rem;font-weight:800">Location request</h1>
          <p style="margin:0;color:var(--text-muted);font-size:.88rem">When HR asks for your location, respond here with a live photo. This is separate from your daily Site Check-in.</p>
        </div>
        <div id="req-area">
          <div class="loading-state"><div class="spinner"></div><span>Loading…</span></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    let currentProfile = null;
    let photoFile = null;
    let camStream = null;

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentProfile = await getUserProfile();
      if (!currentProfile) { showMessage('Could not load profile.', 'error'); return; }
      if (typeof populateSidebar === 'function') populateSidebar(currentProfile);
      loadRequests();
      // Opened this page → clear any ringing check-in notifications.
      try { const reg = await navigator.serviceWorker?.ready; (await reg?.getNotifications())?.forEach(n => n.close()); } catch (_) { }
    })();

    async function loadRequests() {
      const area = document.getElementById('req-area');
      try {
        const token = (await db.auth.getSession()).data.session?.access_token;
        const res = await fetch('/api/receipt-url?my_requests=1', { headers: { Authorization: `Bearer ${token}` } });
        const body = await res.json();
        const reqs = res.ok ? (body.requests || []) : [];
        const badge = document.getElementById('lr-badge');
        if (badge) { badge.textContent = reqs.length || ''; badge.style.display = reqs.length ? 'flex' : 'none'; }

        if (!reqs.length) {
          area.innerHTML = `<div style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:16px;padding:2rem 1.25rem;text-align:center;color:var(--text-muted)">
            <div style="font-size:2rem">✅</div>
            <div style="font-weight:700;color:var(--text-1,#0f172a);margin-top:.4rem">No pending requests right now</div>
            <div style="font-size:.85rem;margin-top:.25rem">Jab HR aapki location maange, wo yahan dikhegी.</div>
          </div>`;
          return;
        }
        const r = reqs[0];
        const mins = Math.max(0, Math.round((Date.now() - new Date(r.sent_at)) / 60000));
        const left = Math.max(0, (r.window_min || 30) - mins);
        area.innerHTML = `
          <div style="background:#fef3c7;border:1.5px solid #fbbf24;border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem">
            <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:#92400e;font-size:.98rem">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              HR has requested your location
            </div>
            <div style="font-size:.83rem;color:#92400e;margin-top:.3rem">Requested ${mins} min ago${left > 0 ? ` · <b>${left} min left</b>` : ' · <b>window passed — respond soon (marked late)</b>'}</div>
          </div>
          <div style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:16px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.05)">
            <label style="display:block;font-size:.82rem;font-weight:600;color:var(--text-2,#475569);margin-bottom:.6rem">Live photo <span style="color:#dc2626">*</span></label>
            <button type="button" id="btn-open-cam" onclick="openCamera()" style="width:100%;padding:1.4rem 0;background:#fff;border:1.5px dashed var(--border);border-radius:12px;font-size:.92rem;font-weight:600;color:#475569;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem">
              <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Open camera
            </button>
            <video id="cam-video" playsinline autoplay muted style="display:none;width:100%;max-height:320px;object-fit:cover;border-radius:12px;background:#000;margin-top:.4rem"></video>
            <button type="button" id="btn-capture" onclick="capturePhoto()" style="display:none;margin-top:.5rem;width:100%;height:46px;background:#4f46e5;color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer">Take photo</button>
            <div id="photo-preview" style="margin-top:.6rem;display:none">
              <img id="photo-thumb" alt="preview" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--border)" />
              <button type="button" onclick="retakePhoto()" style="margin-top:.4rem;background:none;border:none;color:#4f46e5;font-size:.8rem;font-weight:600;cursor:pointer">Retake</button>
            </div>
            <canvas id="cam-canvas" style="display:none"></canvas>
            <button id="btn-send" onclick="sendLocation()" style="margin-top:1rem;width:100%;height:52px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Send location
            </button>
            <div id="send-result" style="margin-top:1rem"></div>
          </div>`;
      } catch (err) { area.innerHTML = `<div style="padding:1rem;color:#991b1b;font-size:.85rem">Error: ${escHtml(err.message)}</div>`; }
    }

    // ── Live camera (same as check-in) ──
    async function openCamera() {
      if (!navigator.mediaDevices?.getUserMedia) return showMessage('Live camera isn\'t supported on this device/browser.', 'error');
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        const v = document.getElementById('cam-video');
        v.srcObject = camStream; v.style.display = '';
        document.getElementById('btn-capture').style.display = '';
        document.getElementById('btn-open-cam').style.display = 'none';
        document.getElementById('photo-preview').style.display = 'none';
      } catch (e) { showMessage('Camera didn\'t open — allow camera permission.', 'error'); }
    }
    function capturePhoto() {
      const v = document.getElementById('cam-video');
      const w = v.videoWidth, h = v.videoHeight;
      if (!w || !h) return showMessage('Camera isn\'t ready yet — wait a second and try again.', 'error');
      const c = document.getElementById('cam-canvas');
      c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h);
      c.toBlob(blob => {
        if (!blob) return showMessage('Photo capture failed — try again.', 'error');
        photoFile = new File([blob], `verify_${Date.now()}.jpg`, { type: 'image/jpeg' });
        document.getElementById('photo-thumb').src = URL.createObjectURL(blob);
        document.getElementById('photo-preview').style.display = '';
        document.getElementById('btn-capture').style.display = 'none';
        stopCamera();
      }, 'image/jpeg', 0.9);
    }
    function retakePhoto() { photoFile = null; document.getElementById('photo-preview').style.display = 'none'; openCamera(); }
    function stopCamera() {
      if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
      const v = document.getElementById('cam-video'); v.style.display = 'none'; v.srcObject = null;
    }

    async function sendLocation() {
      if (!photoFile) return showMessage('Take a live photo first — a photo is required.', 'error');
      if (!navigator.geolocation) return showMessage('GPS isn\'t supported on this device.', 'error');
      const btn = document.getElementById('btn-send'), orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = 'Getting GPS…';
      const result = document.getElementById('send-result'); result.innerHTML = '';
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        try {
          const token = (await db.auth.getSession()).data.session?.access_token;
          btn.innerHTML = 'Uploading photo…';
          const photo_url = await uploadReceipt(photoFile, currentProfile.id);
          if (!photo_url) throw new Error('Photo upload failed — check your network and try again.');
          btn.innerHTML = 'Sending…';
          // No site selection on this screen — use the employee's usual site if known, else a marker.
          const site = resolveUsualSite() || { code: 'VERIFY', name: 'Location Verify' };
          const res = await fetch('/api/receipt-url', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ checkin: { site_code: site.code, site_name: site.name, latitude, longitude, accuracy, photo_url, source: 'notification' } })
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || 'Failed');
          result.innerHTML = `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:1rem;color:#166534">
            <div style="font-size:1.05rem;font-weight:800">✅ Location sent to HR</div>
            <div style="font-size:.85rem;margin-top:.25rem">${body.location_name ? escHtml(body.location_name) : 'Your current location'} recorded. Thank you.</div>
          </div>`;
          photoFile = null;
          setTimeout(loadRequests, 1500); // refresh — request now answered
        } catch (err) {
          result.innerHTML = `<div style="color:#dc2626;font-size:.85rem">${escHtml(err.message)}</div>`;
        } finally { btn.disabled = false; btn.innerHTML = orig; }
      }, (err) => {
        btn.disabled = false; btn.innerHTML = orig;
        const msg = err.code === 1 ? 'GPS permission needed (allow location in the browser).' : 'Couldn\'t get GPS location — try in the open.';
        result.innerHTML = `<div style="color:#dc2626;font-size:.85rem">${msg}</div>`;
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    }

    function resolveUsualSite() {
      const sites = (typeof SITE_DATA !== 'undefined' ? SITE_DATA : []);
      const mine = (currentProfile.site_name || '').trim().toLowerCase();
      return mine ? sites.find(s => s.name.toLowerCase() === mine) : null;
    }
  </script>
</body>

</html>
