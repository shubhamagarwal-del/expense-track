<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseTrack — Add GRN</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/pwa-register.js" defer></script>
</head>

<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon"><img src="/icon-192.png" alt="ExpenseTrack" /></div>
        <span class="logo-text">ExpenseTrack</span>
      </div>
      <div class="sidebar-nav">
        <p class="sidebar-nav-label">Menu</p>
        <a href="dashboard.html" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          Dashboard
        </a>
        <a href="add-expense.html" class="sidebar-link" id="sb-add-link" style="display:none">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
          Add Expense
        </a>
        <a href="add-grn.html" class="sidebar-link active" id="sb-grn-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" /></svg>
          Add GRN
        </a>
        <a href="attendance-checkin.html" class="sidebar-link" id="sb-checkin-link" style="display:none">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          Site Check-in
        </a>
        <a href="location-request.html" class="sidebar-link" id="sb-location-request-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
          Location Request
        </a>
        <a href="profile.html" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          My Profile
        </a>
        <a href="#" onclick="logout();return false" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          Sign Out
        </a>
      </div>
    </nav>

    <div class="app-main">
      <header class="topbar">
        <button class="topbar-menu" onclick="toggleSidebar()" aria-label="Open menu">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <span class="topbar-title">Add GRN</span>
        <div class="topbar-right"></div>
      </header>

      <main class="page-content" style="max-width:560px;margin:0 auto">
        <div style="margin-bottom:1rem">
          <h1 style="margin:0 0 .25rem;font-size:1.35rem;font-weight:800">Goods Receipt Note</h1>
          <p style="margin:0;color:var(--text-muted);font-size:.88rem">Material aane par yahan submit karein — same Manager → HR → Audit chain se review hoga jaise expenses.</p>
        </div>

        <form id="grn-form" style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:16px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.05)">
          <div class="form-group mb-3">
            <label class="form-label">Site <span style="color:#dc2626">*</span></label>
            <div style="position:relative">
              <input type="text" id="grn-site-input" class="form-input" autocomplete="off" required
                     placeholder="Search site name, district or code…" style="width:100%;padding-right:2rem">
              <button type="button" id="grn-site-clear" title="Clear site" style="display:none;position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted,#71717a);font-size:1rem;line-height:1;padding:2px">✕</button>
              <input type="hidden" id="grn-site-code">
              <input type="hidden" id="grn-site-name">
              <div id="grn-site-list" style="display:none;position:absolute;z-index:50;top:100%;left:0;right:0;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:10px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.1)"></div>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Date received <span style="color:#dc2626">*</span></label>
            <input type="date" id="grn-date" class="form-input" required style="width:100%">
          </div>

          <div class="form-group mb-3">
            <label class="form-label">PO number</label>
            <input type="text" id="grn-po" class="form-input" placeholder="e.g. PO-4521" style="width:100%">
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Vendor name <span style="color:#dc2626">*</span></label>
            <input type="text" id="grn-vendor" class="form-input" required placeholder="Supplier / vendor name" style="width:100%">
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Items <span style="color:#dc2626">*</span></label>
            <div id="grn-items-list"></div>
            <button type="button" onclick="addGrnItemRow()" style="margin-top:.3rem;width:100%;padding:.55rem;border:1.5px dashed var(--border);border-radius:10px;background:none;color:#2563eb;font-weight:700;font-size:.85rem;cursor:pointer">+ Add another item</button>
          </div>

          <div class="form-group mb-0">
            <label class="form-label">Invoice / challan photo <span style="color:#dc2626">*</span></label>
            <div id="grn-photo-box" style="position:relative;border:1.5px dashed var(--border);border-radius:12px;padding:1.4rem 0;text-align:center;color:var(--text-muted,#71717a);font-size:.88rem;font-weight:600;cursor:pointer">
              <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" style="margin:0 auto .35rem;display:block"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span id="grn-photo-label">Tap to capture or upload</span>
              <input type="file" id="grn-photo-input" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer">
            </div>
            <img id="grn-photo-preview" style="display:none;margin-top:.6rem;width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--border)">
          </div>

          <button type="submit" id="grn-submit-btn" style="margin-top:1.25rem;width:100%;height:52px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:1.02rem;font-weight:700;cursor:pointer">Submit GRN</button>
          <div id="grn-form-msg" style="margin-top:.8rem"></div>
        </form>

        <div style="margin:1.75rem 0 .75rem;font-weight:800;font-size:1.02rem">My GRNs</div>
        <div id="grn-list"><div class="loading-state"><div class="spinner"></div><span>Loading…</span></div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    let currentProfile = null;
    let grnPhotoFile = null;

    const GRN_STATUS_META = {
      pending:       { label: '⏳ Pending — Manager',  bg: '#fef9c3', col: '#854d0e' },
      l1_approved:   { label: '✅ Manager OK — HR',    bg: '#dbeafe', col: '#1e40af' },
      l1_rejected:   { label: '❌ Rejected — Manager',  bg: '#fee2e2', col: '#991b1b' },
      hr_approved:   { label: '✅ HR OK — Audit',       bg: '#e0e7ff', col: '#3730a3' },
      audit_cleared: { label: '✅ Cleared',             bg: '#dcfce7', col: '#166534' },
      rejected:      { label: '❌ Rejected',            bg: '#fee2e2', col: '#991b1b' },
    };

    function formatGrnItems(items) {
      return (items || []).map(it => `${it.item} (${it.qty})`).join(' · ') || '—';
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentProfile = await getUserProfile();
      if (!currentProfile) { showMessage('Could not load profile.', 'error'); return; }
      if (typeof populateSidebar === 'function') populateSidebar(currentProfile);

      document.getElementById('grn-date').value = new Date().toISOString().slice(0, 10);
      initSiteAutocomplete();
      addGrnItemRow();
      loadMyGrns();

      document.getElementById('grn-photo-input').addEventListener('change', onPhotoChosen);
      document.getElementById('grn-form').addEventListener('submit', onSubmitGrn);
    })();

    // ── Repeatable item rows — one invoice can cover several items ──
    function addGrnItemRow() {
      const row = document.createElement('div');
      row.className = 'grn-item-row';
      row.style.cssText = 'display:flex;gap:.5rem;margin-bottom:.5rem;align-items:center';
      row.innerHTML = `
        <input type="text" class="grn-item-name" placeholder="Item name" style="flex:2;padding:.6rem .75rem;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:.88rem;box-sizing:border-box">
        <input type="text" class="grn-item-qty" placeholder="Qty (e.g. 20 nos)" style="flex:1;padding:.6rem .75rem;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:.88rem;box-sizing:border-box">
        <button type="button" onclick="removeGrnItemRow(this)" title="Remove item" style="flex-shrink:0;width:34px;height:34px;border:none;background:#fef2f2;color:#dc2626;border-radius:8px;cursor:pointer;font-weight:700">✕</button>
      `;
      document.getElementById('grn-items-list').appendChild(row);
    }

    function removeGrnItemRow(btn) {
      const list = document.getElementById('grn-items-list');
      btn.closest('.grn-item-row').remove();
      if (!list.children.length) addGrnItemRow();
    }

    /** Reads all item rows, keeping only ones where both name and qty are filled. */
    function collectGrnItems() {
      return [...document.querySelectorAll('.grn-item-row')].map(row => ({
        item: row.querySelector('.grn-item-name').value.trim(),
        qty: row.querySelector('.grn-item-qty').value.trim(),
      })).filter(r => r.item && r.qty);
    }

    // ── Site autocomplete (search-as-you-type instead of a 130-option <select>) ──
    function initSiteAutocomplete() {
      const input = document.getElementById('grn-site-input');
      const list = document.getElementById('grn-site-list');
      const clearBtn = document.getElementById('grn-site-clear');
      const codeEl = document.getElementById('grn-site-code');
      const nameEl = document.getElementById('grn-site-name');

      const updateClearBtn = () => { clearBtn.style.display = codeEl.value ? '' : 'none'; };

      const pickSite = (s) => {
        input.value = `${s.name} — ${s.code}`;
        codeEl.value = s.code; nameEl.value = s.name;
        list.style.display = 'none';
        updateClearBtn();
      };

      const mine = (currentProfile.site_name || '').trim().toLowerCase();
      if (mine) {
        const match = SITE_DATA.find(s => s.name.toLowerCase() === mine);
        if (match) pickSite(match);
      }

      clearBtn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        input.value = ''; codeEl.value = ''; nameEl.value = '';
        updateClearBtn();
        list.style.display = 'none';
        input.focus();
      });

      input.addEventListener('input', () => {
        codeEl.value = ''; nameEl.value = '';
        updateClearBtn();
        const q = input.value.trim().toLowerCase();
        if (!q) { list.style.display = 'none'; return; }
        const hits = SITE_DATA.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.code.toLowerCase().startsWith(q) ||
          (s.district && s.district.toLowerCase().includes(q))
        ).sort((a, b) => {
          const aStarts = a.name.toLowerCase().startsWith(q) ? 0 : 1;
          const bStarts = b.name.toLowerCase().startsWith(q) ? 0 : 1;
          return aStarts - bStarts;
        }).slice(0, 8);
        if (!hits.length) { list.style.display = 'none'; return; }
        list.innerHTML = hits.map((s, i) =>
          `<div class="grn-site-item" data-idx="${i}" style="padding:.55rem .8rem;cursor:pointer;font-size:.85rem;border-bottom:1px solid var(--border)">
            <span style="font-weight:600;color:#1e293b">${escHtml(s.name)}</span>
            <span style="color:#94a3b8"> — ${s.district ? escHtml(s.district) + ' — ' : ''}${escHtml(s.code)}</span>
          </div>`
        ).join('');
        [...list.children].forEach((el, i) => {
          el.addEventListener('mouseenter', () => el.style.background = '#eef2ff');
          el.addEventListener('mouseleave', () => el.style.background = '');
          el.addEventListener('mousedown', (e) => { e.preventDefault(); pickSite(hits[i]); });
        });
        list.style.display = 'block';
      });

      input.addEventListener('blur', () => {
        setTimeout(() => {
          list.style.display = 'none';
          if (!codeEl.value) input.value = '';
        }, 150);
      });
      input.addEventListener('focus', () => { if (input.value && !codeEl.value) input.dispatchEvent(new Event('input')); });
    }

    function onPhotoChosen(e) {
      const file = e.target.files[0];
      if (!file) return;
      grnPhotoFile = file;
      document.getElementById('grn-photo-label').textContent = file.name;
      const preview = document.getElementById('grn-photo-preview');
      preview.src = URL.createObjectURL(file);
      preview.style.display = '';
    }

    async function onSubmitGrn(e) {
      e.preventDefault();
      const msg = document.getElementById('grn-form-msg');
      msg.innerHTML = '';

      const site_code = document.getElementById('grn-site-code').value;
      const site_name = document.getElementById('grn-site-name').value;
      const date = document.getElementById('grn-date').value;
      const po = document.getElementById('grn-po').value.trim();
      const vendor = document.getElementById('grn-vendor').value.trim();
      const items = collectGrnItems();

      if (!site_code) return msg.innerHTML = errBox('Select a site from the list.');
      if (!date) return msg.innerHTML = errBox('Select the date received.');
      if (!vendor) return msg.innerHTML = errBox('Enter the vendor name.');
      if (!items.length) return msg.innerHTML = errBox('Add at least one item with its quantity.');
      if (!grnPhotoFile) return msg.innerHTML = errBox('Attach the invoice / challan photo.');
      const btn = document.getElementById('grn-submit-btn');
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Uploading photo…';

      try {
        const receipt_url = await uploadReceipt(grnPhotoFile, currentProfile.id);
        if (!receipt_url) throw new Error('Photo upload failed — check your network and try again.');

        btn.textContent = 'Submitting…';
        await initSupabase();
        const { error } = await db.from('grn_entries').insert({
          user_id: currentProfile.id,
          company_id: currentProfile.company_id || null,
          site_code, site_name,
          received_date: date,
          po_number: po || null,
          vendor_name: vendor,
          items,
          receipt_url,
        });
        if (error) throw error;

        msg.innerHTML = `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:.8rem 1rem;color:#166534;font-size:.88rem;font-weight:600">✅ GRN submitted — sent for Manager approval.</div>`;
        document.getElementById('grn-form').reset();
        document.getElementById('grn-date').value = new Date().toISOString().slice(0, 10);
        document.getElementById('grn-items-list').innerHTML = '';
        addGrnItemRow();
        grnPhotoFile = null;
        document.getElementById('grn-photo-preview').style.display = 'none';
        document.getElementById('grn-photo-label').textContent = 'Tap to capture or upload';
        loadMyGrns();
      } catch (err) {
        msg.innerHTML = errBox(err.message || 'Submit failed — try again.');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    function errBox(text) {
      return `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:.8rem 1rem;color:#dc2626;font-size:.85rem;font-weight:600">${escHtml(text)}</div>`;
    }

    async function loadMyGrns() {
      const list = document.getElementById('grn-list');
      try {
        await initSupabase();
        const { data, error } = await db.from('grn_entries')
          .select('*').eq('user_id', currentProfile.id)
          .order('created_at', { ascending: false }).limit(50);
        if (error) throw error;

        if (!data.length) {
          list.innerHTML = `<div style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:16px;padding:1.5rem 1.25rem;text-align:center;color:var(--text-muted)">No GRNs submitted yet.</div>`;
          return;
        }
        list.innerHTML = data.map(g => {
          const meta = GRN_STATUS_META[g.status] || { label: g.status, bg: '#f1f5f9', col: '#334155' };
          return `<div style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">
              <div>
                <div style="font-weight:700;font-size:.92rem">${escHtml(formatGrnItems(g.items))}</div>
                <div style="font-size:.8rem;color:var(--text-muted);margin-top:.15rem">${escHtml(g.vendor_name)}${g.po_number ? ' · PO ' + escHtml(g.po_number) : ''}</div>
                <div style="font-size:.78rem;color:var(--text-muted);margin-top:.15rem">${escHtml(g.site_name || '')} · ${escHtml(g.received_date)}</div>
              </div>
              <span style="flex-shrink:0;background:${meta.bg};color:${meta.col};font-size:.72rem;font-weight:700;padding:.25rem .55rem;border-radius:999px;white-space:nowrap">${meta.label}</span>
            </div>
            ${g.rejection_reason ? `<div style="margin-top:.5rem;font-size:.8rem;color:#991b1b">Reason: ${escHtml(g.rejection_reason)}</div>` : ''}
          </div>`;
        }).join('');
      } catch (err) {
        list.innerHTML = `<div style="padding:1rem;color:#991b1b;font-size:.85rem">Error: ${escHtml(err.message)}</div>`;
      }
    }
  </script>
</body>

</html>
