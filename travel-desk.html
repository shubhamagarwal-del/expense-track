<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseTrack — Travel Desk</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/pwa-register.js" defer></script>
</head>

<body>
  <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon"><img src="/icon-192.png" alt="ExpenseTrack" /></div>
        <span class="logo-text">ExpenseTrack</span>
      </div>
      <div class="sidebar-nav">
        <p class="sidebar-nav-label">Menu</p>
        <a href="travel-desk.html" class="sidebar-link active">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
          Travel Desk
        </a>
        <a href="profile.html" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          My Profile
        </a>
        <a href="#" onclick="logout();return false" class="sidebar-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          Sign Out
        </a>
      </div>
    </nav>

    <div class="app-main">
      <header class="topbar">
        <button class="topbar-menu" onclick="toggleSidebar()" aria-label="Open menu">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <span class="topbar-title">Travel Desk</span>
        <div class="topbar-right"></div>
      </header>

      <main class="page-content" style="max-width:560px;margin:0 auto">
        <div style="margin-bottom:1rem">
          <h1 style="margin:0 0 .25rem;font-size:1.35rem;font-weight:800">Pre-booked Travel</h1>
          <p style="margin:0;color:var(--text-muted);font-size:.88rem">Yahan ticket log karo jab bhi kisi employee ke liye train/flight book karo — us employee ko phir usi date ka travel expense claim karne se roka jayega.</p>
        </div>

        <form id="pt-form" style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:16px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.05)">
          <div class="form-group mb-3">
            <label class="form-label">Employee <span style="color:#dc2626">*</span></label>
            <div style="position:relative">
              <input type="text" id="pt-emp-input" class="form-input" autocomplete="off" required
                     placeholder="Search name or employee no…" style="width:100%;padding-right:2rem">
              <button type="button" id="pt-emp-clear" title="Clear" style="display:none;position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted,#71717a);font-size:1rem;line-height:1;padding:2px">✕</button>
              <input type="hidden" id="pt-emp-id">
              <div id="pt-emp-list" style="display:none;position:absolute;z-index:50;top:100%;left:0;right:0;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:10px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.1)"></div>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Travel date <span style="color:#dc2626">*</span></label>
            <input type="date" id="pt-date" class="form-input" required style="width:100%">
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Route <span style="color:#dc2626">*</span></label>
            <input type="text" id="pt-route" class="form-input" required placeholder="e.g. Jaipur → Delhi" style="width:100%">
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Mode <span style="color:#dc2626">*</span></label>
            <select id="pt-mode" class="form-input" required style="width:100%">
              <option value="train">Train</option>
              <option value="flight">Flight</option>
              <option value="bus">Bus</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group mb-0">
            <label class="form-label">PNR / ticket ref (optional)</label>
            <input type="text" id="pt-ref" class="form-input" placeholder="e.g. JS1262705AB17204" style="width:100%">
          </div>

          <button type="submit" id="pt-submit-btn" style="margin-top:1.25rem;width:100%;height:52px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:1.02rem;font-weight:700;cursor:pointer">Log Ticket</button>
          <div id="pt-form-msg" style="margin-top:.8rem"></div>
        </form>

        <div style="margin:1.75rem 0 .75rem;font-weight:800;font-size:1.02rem">Recently Logged</div>
        <div id="pt-list"><div class="loading-state"><div class="spinner"></div><span>Loading…</span></div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    let currentProfile = null;
    let usersMap = {};

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      currentProfile = await getUserProfile();
      if (!currentProfile) { showMessage('Could not load profile.', 'error'); return; }
      if (currentProfile.role !== 'travel_desk') {
        location.href = 'dashboard.html';
        return;
      }

      document.getElementById('pt-date').value = new Date().toISOString().slice(0, 10);
      usersMap = await fetchUsersMap();
      initEmpAutocomplete();
      loadRecentEntries();

      document.getElementById('pt-form').addEventListener('submit', onSubmitTicket);
    })();

    function initEmpAutocomplete() {
      const input = document.getElementById('pt-emp-input');
      const list = document.getElementById('pt-emp-list');
      const clearBtn = document.getElementById('pt-emp-clear');
      const idEl = document.getElementById('pt-emp-id');
      const employees = Object.values(usersMap).filter(u => u.name);

      const updateClearBtn = () => { clearBtn.style.display = idEl.value ? '' : 'none'; };

      const pickEmp = (u) => {
        input.value = `${u.name}${u.emp_no ? ' — ' + u.emp_no : ''}`;
        idEl.value = u.id;
        list.style.display = 'none';
        updateClearBtn();
      };

      clearBtn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        input.value = ''; idEl.value = '';
        updateClearBtn();
        list.style.display = 'none';
        input.focus();
      });

      input.addEventListener('input', () => {
        idEl.value = '';
        updateClearBtn();
        const q = input.value.trim().toLowerCase();
        if (!q) { list.style.display = 'none'; return; }
        const hits = employees.filter(u =>
          u.name.toLowerCase().includes(q) || (u.emp_no && u.emp_no.toLowerCase().includes(q))
        ).slice(0, 8);
        if (!hits.length) { list.style.display = 'none'; return; }
        list.innerHTML = hits.map((u, i) =>
          `<div class="pt-emp-item" data-idx="${i}" style="padding:.55rem .8rem;cursor:pointer;font-size:.85rem;border-bottom:1px solid var(--border)">
            <span style="font-weight:600;color:#1e293b">${escHtml(u.name)}</span>
            <span style="color:#94a3b8"> — ${escHtml(u.emp_no || '')}${u.department ? ' · ' + escHtml(u.department) : ''}</span>
          </div>`
        ).join('');
        [...list.children].forEach((el, i) => {
          el.addEventListener('mouseenter', () => el.style.background = '#eef2ff');
          el.addEventListener('mouseleave', () => el.style.background = '');
          el.addEventListener('mousedown', (e) => { e.preventDefault(); pickEmp(hits[i]); });
        });
        list.style.display = 'block';
      });

      input.addEventListener('blur', () => {
        setTimeout(() => {
          list.style.display = 'none';
          if (!idEl.value) input.value = '';
        }, 150);
      });
    }

    async function onSubmitTicket(e) {
      e.preventDefault();
      const msg = document.getElementById('pt-form-msg');
      msg.innerHTML = '';

      const user_id = document.getElementById('pt-emp-id').value;
      const travel_date = document.getElementById('pt-date').value;
      const route = document.getElementById('pt-route').value.trim();
      const mode = document.getElementById('pt-mode').value;
      const ticket_ref = document.getElementById('pt-ref').value.trim();

      if (!user_id) return msg.innerHTML = errBox('Select an employee from the list.');
      if (!travel_date) return msg.innerHTML = errBox('Select the travel date.');
      if (!route) return msg.innerHTML = errBox('Enter the route.');

      const btn = document.getElementById('pt-submit-btn');
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Saving…';

      try {
        await initSupabase();
        const { error } = await db.from('prebooked_travel').insert({
          user_id, travel_date, route, mode,
          ticket_ref: ticket_ref || null,
          added_by: currentProfile.id,
          added_by_name: currentProfile.name,
        });
        if (error) throw error;

        msg.innerHTML = `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:.8rem 1rem;color:#166534;font-size:.88rem;font-weight:600">✅ Ticket logged.</div>`;
        document.getElementById('pt-form').reset();
        document.getElementById('pt-date').value = new Date().toISOString().slice(0, 10);
        document.getElementById('pt-emp-id').value = '';
        document.getElementById('pt-emp-clear').style.display = 'none';
        loadRecentEntries();
      } catch (err) {
        msg.innerHTML = errBox(err.message || 'Save failed — try again.');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    function errBox(text) {
      return `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:.8rem 1rem;color:#dc2626;font-size:.85rem;font-weight:600">${escHtml(text)}</div>`;
    }

    async function loadRecentEntries() {
      const list = document.getElementById('pt-list');
      try {
        await initSupabase();
        const { data, error } = await db.from('prebooked_travel')
          .select('*').order('created_at', { ascending: false }).limit(50);
        if (error) throw error;

        if (!data.length) {
          list.innerHTML = `<div style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:16px;padding:1.5rem 1.25rem;text-align:center;color:var(--text-muted)">Koi ticket abhi tak log nahi hua.</div>`;
          return;
        }
        const modeIcon = { train: '🚆', flight: '✈️', bus: '🚌', other: '🎫' };
        list.innerHTML = data.map(t => {
          const u = usersMap[t.user_id];
          return `<div style="background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">
              <div>
                <div style="font-weight:700;font-size:.92rem">${modeIcon[t.mode] || '🎫'} ${escHtml(u?.name || 'Unknown')}${u?.emp_no ? ' (' + escHtml(u.emp_no) + ')' : ''}</div>
                <div style="font-size:.8rem;color:var(--text-muted);margin-top:.15rem">${escHtml(t.route)}${t.ticket_ref ? ' · ' + escHtml(t.ticket_ref) : ''}</div>
              </div>
              <span style="flex-shrink:0;background:#e0e7ff;color:#3730a3;font-size:.72rem;font-weight:700;padding:.25rem .55rem;border-radius:999px;white-space:nowrap">${escHtml(t.travel_date)}</span>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        list.innerHTML = `<div style="padding:1rem;color:#991b1b;font-size:.85rem">Error: ${escHtml(err.message)}</div>`;
      }
    }
  </script>
</body>

</html>
